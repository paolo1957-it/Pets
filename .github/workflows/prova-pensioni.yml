# TEMPORANEO: diagnosi delle pensioni per animali. Non pubblica nulla. Da togliere prima di unire a main.
name: Prova pensioni (diagnosi)
on:
  push:
    branches: ["claude/**"]
    paths: ["prova/**", ".github/workflows/prova-pensioni.yml"]
permissions:
  contents: read
jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node prova/diagnosi_osm.js
        timeout-minutes: 40
  overture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet pyarrow fsspec aiohttp
      - run: python3 prova/diagnosi_overture.py
        timeout-minutes: 40
