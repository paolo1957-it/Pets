# TEMPORANEO: anteprima dei dati con le pensioni. Scarica come la pubblicazione ma NON pubblica nulla.
name: Prova pensioni (diagnosi)
on:
  push:
    branches: ["claude/**"]
    paths: ["prova/**", ".github/workflows/prova-pensioni.yml"]
permissions:
  contents: read
jobs:
  anteprima:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet pyarrow fsspec aiohttp
      - run: node aggiorna_animali.js
        timeout-minutes: 60
        env:
          FORZA: "1"
      - run: node prova/conta_pensioni.js
